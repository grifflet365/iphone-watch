name: price
on:
  schedule:
    - cron: "0 1,5,9 * * *"   # 10:00 / 14:00 / 18:00 JST
  workflow_dispatch:
concurrency:
  group: price
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  price:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 価格通知
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python watch.py price
      - name: 状態を保存
        run: |
          git config user.name "watch-bot"
          git config user.email "watch-bot@users.noreply.github.com"
          git add state_price.json
          git diff --cached --quiet || (git commit -m "update state" && git pull --rebase && git push)
