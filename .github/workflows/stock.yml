name: stock
on:
  schedule:
    - cron: "30 20 * * *"      # 5:30 JST 朝の集中監視(起動遅れ対策で2回)
    - cron: "45 20 * * *"      # 5:45 JST
    - cron: "*/15 1-20 * * *"  # 10:00〜翌5:59 JST は15分間隔で1回チェック
  workflow_dispatch:
concurrency:
  group: stock
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  stock:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 監視
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # 現在(JST)から10:00までの残り分数。朝6〜10時以外は1回だけ確認する
          now=$(TZ=Asia/Tokyo date +%s)
          end=$(TZ=Asia/Tokyo date -d "10:00" +%s)
          h=$(TZ=Asia/Tokyo date +%H)
          if [ "$h" -ge 5 ] && [ "$h" -lt 10 ]; then
            min=$(( (end - now) / 60 ))
            python watch.py stock --minutes "$min" --interval 30
          else
            python watch.py stock --minutes 1
          fi
      - name: 状態を保存
        if: always()
        run: |
          test -f state.json || exit 0
          git config user.name "watch-bot"
          git config user.email "watch-bot@users.noreply.github.com"
          # 他の実行と衝突しないよう、最新を取り直してから自分の結果を載せる
          cp state.json "$RUNNER_TEMP/state.json"
          cp restock_log.jsonl "$RUNNER_TEMP/log.jsonl" 2>/dev/null || true
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/state.json" state.json
            # 履歴は両方の行を合わせ、重複を除く(先に保存された分を残す)
            cat restock_log.jsonl "$RUNNER_TEMP/log.jsonl" 2>/dev/null | awk '!seen[$0]++' > "$RUNNER_TEMP/merged.jsonl" || true
            [ -s "$RUNNER_TEMP/merged.jsonl" ] && cp "$RUNNER_TEMP/merged.jsonl" restock_log.jsonl
            git add state.json restock_log.jsonl
            git diff --cached --quiet && exit 0
            git commit -m "update state"
            git push && exit 0
            sleep $((i * 3))
          done
          echo "状態の保存に失敗しました"; exit 1
